# .github/workflows/ocorrencias.yml
#
# Atualiza dados/PAINEL_MES_ATUAL.csv com o relatório do 1º BBM, do dia 1 do
# mês corrente até hoje. O painel do CIOSP lê esse arquivo direto do raw do
# GitHub — não precisa de mais nada.

name: Ocorrências do mês (1º BBM)

on:
  schedule:
    # A cada hora cheia. O GitHub usa UTC: 3h à frente de Porto Alegre.
    # De hora em hora cobre o dia todo sem precisar pensar em fuso.
    - cron: "0 * * * *"
  workflow_dispatch:        # permite rodar na mão pelo botão do Actions

# Necessário para o passo de commit escrever de volta no repositório
permissions:
  contents: write

concurrency:
  # Se uma execução demorar mais que a hora, a próxima espera em vez de
  # rodar junto — duas sessões simultâneas no E193 dão problema.
  group: ocorrencias
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Coletar o relatório
        # A credencial já existe num Secret criado para o coletor da escala.
        # Aqui vão os nomes possíveis: Secret que não existe chega vazio, e o
        # script usa o primeiro que vier preenchido. Se o seu nome não estiver
        # na lista, acrescente uma linha no mesmo formato.
        env:
          E193_USUARIO:  ${{ secrets.E193_USUARIO }}
          E193_USER:     ${{ secrets.E193_USER }}
          E193_LOGIN:    ${{ secrets.E193_LOGIN }}
          E193_ID:       ${{ secrets.E193_ID }}
          ID_FUNCIONAL:  ${{ secrets.ID_FUNCIONAL }}
          USUARIO_E193:  ${{ secrets.USUARIO_E193 }}
          E193_SENHA:    ${{ secrets.E193_SENHA }}
          E193_PASSWORD: ${{ secrets.E193_PASSWORD }}
          E193_PASS:     ${{ secrets.E193_PASS }}
          SENHA_E193:    ${{ secrets.SENHA_E193 }}
        run: node scripts/coletar-ocorrencias.mjs

      # Print e HTML da tela onde parou. Sem isto, uma falha de login vira
      # só "timeout" e não dá para descobrir nada.
      - name: Guardar o diagnóstico quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: diagnostico/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar o arquivo
        run: |
          git config user.name  "coletor-ocorrencias"
          git config user.email "actions@users.noreply.github.com"
          git add dados/PAINEL_MES_ATUAL.csv
          # Sem mudança nenhuma não há o que commitar, e isso é normal:
          # se ninguém atendeu ocorrência na última hora, o arquivo é o mesmo.
          if git diff --staged --quiet; then
            echo "Nada mudou desde a última coleta."
          else
            git commit -m "Ocorrências do mês — $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            git push
          fi
